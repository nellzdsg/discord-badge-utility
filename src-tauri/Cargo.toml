[package]
name = "discord-badge-utility"
version = "0.1.0"
description = "Local game activity helper for Discord profile badges"
authors = ["nellzdsg"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "discord_badge_utility_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
