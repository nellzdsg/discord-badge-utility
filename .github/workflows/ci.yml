name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate app icons
        run: npm run icons

      - name: Build app and installer
        run: npx tauri build --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $exe = Get-ChildItem "src-tauri/target/release" -Filter *.exe |
            Where-Object { $_.Name -notlike "build_script*" } |
            Select-Object -First 1
          if (-not $exe) { throw "Portable executable not found" }
          Copy-Item $exe.FullName "artifacts/discord-badge-utility_portable.exe"

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe |
            Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName "artifacts/discord-badge-utility_setup.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/*
          retention-days: 14
