name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate app icons
        run: npm run icons

      - name: Build app and installer
        run: npx tauri build --bundles nsis

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Release tag is empty" }
          $ver = $tag.TrimStart('v')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Collect artifacts
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $exe = Get-ChildItem "src-tauri/target/release" -Filter *.exe |
            Where-Object { $_.Name -notlike "build_script*" } |
            Select-Object -First 1
          if (-not $exe) { throw "Portable executable not found" }
          Copy-Item $exe.FullName "artifacts/discord-badge-utility_${version}_x64_portable.exe"

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe |
            Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName "artifacts/discord-badge-utility_${version}_x64_setup.exe"

          $lines = Get-ChildItem artifacts -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content "artifacts/SHA256SUMS.txt" -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Discord Badge Utility ${{ steps.version.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
